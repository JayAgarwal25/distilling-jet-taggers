[build-system]
requires = ["setuptools>=77", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[project]
name = "jetkd"
version = "1.0.0"
description = "Knowledge Distillation from Large Jet Taggers"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jay Agarwal" },
  { name = "Siddharth Khare" },
  { name = "Dhruv Kumar" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]
# lgatr and lloca are pinned exactly: the released checkpoints were trained on these versions
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "lgatr==2.0.0",
  "lloca==2.0.0",
  "torch-geometric>=2.7",
  "pytorch-optimizer>=3.10,<4",
]

[project.optional-dependencies]
xformers = ["xformers"]
benchmark = ["psutil", "omnilearned"]
teachers = ["uproot", "h5py"]
dev = ["pytest", "ruff", "pre-commit"]

[project.urls]
repository = "https://github.com/JayAgarwal25/distilling-jet-taggers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data/", "runs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
